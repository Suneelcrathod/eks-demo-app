apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - name: my-app
        image: 143315839705.dkr.ecr.us-east-1.amazonaws.com/docker-container-testing:latest
        ports:
        - containerPort: 80
